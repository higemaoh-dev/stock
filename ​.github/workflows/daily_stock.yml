name: Daily Stock Analysis

on:
  schedule:
    # UTCで前日21:30 ＝ 日本時間(JST)で毎朝06:30に自動実行
    - cron: '30 21 * * *'
  # GitHubの画面から手動で即時実行（テスト用）できるようにする設定
  workflow_dispatch:

jobs:
  run-stock-analysis:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコード（main.py, requirements.txt）を取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.11 環境のセットアップ
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. requirements.txt に記載された依存ライブラリを一括インストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. main.py を実行し、APIキーを環境変数として引き渡す
      - name: Run Stock Analysis Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
